name: CI — tests, lint, security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # Migrations and the PostgreSQL-only tests run against a real server;
    # the rest of the suite stays on SQLite.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: septum
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: septum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U septum -d septum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('packages/api/requirements.txt', 'packages/*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies (api + its deps + requirements.txt)
        run: |
          python -m pip install --upgrade pip
          # gateway[test] is installed because some api integration tests use
          # gateway constants and respx; modular-tests still runs the gateway suite.
          # mcp / audit are covered by modular-tests.
          python -m pip install -e "packages/core[transformers,test]"
          python -m pip install -e "packages/queue[redis,test]"
          python -m pip install -e "packages/gateway[test]"
          python -m pip install -e "packages/api[auth,rate-limit,postgres,server,test]"
          # Heavy ML / OCR / Whisper / ingestion deps (single source of
          # truth for the services/ layer).
          python -m pip install -r packages/api/requirements.txt

      # The OCR regression test runs the real PP-OCRv5 models (~130 MB), fetched
      # at their pinned revisions into the Hugging Face hub cache. Tests keep the
      # NER layer off, so only the PaddleOCR repos are cached. Keyed on the pin
      # manifest with no restore-keys: a pin bump starts from an empty cache
      # instead of carrying superseded revisions forward.
      - name: Cache pinned PaddleOCR models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--PaddlePaddle--*
          key: ${{ runner.os }}-hf-paddleocr-${{ hashFiles('packages/core/septum_core/model_pins.py') }}

      # Upgrade, check the models match, step one revision down and back up.
      - name: Check database migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://septum:ci@localhost:5432/septum
        run: |
          cd packages/api
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests
        env:
          SEPTUM_TEST_POSTGRES_URL: postgresql+asyncpg://septum:ci@localhost:5432/septum
        run: pytest packages/api/tests -q

  modular-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-modular-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-modular-

      - name: Install septum-queue (+ redis + test extras)
        # Queue stays stdlib-only at runtime; [redis] pulls the Redis
        # Streams backend and fakeredis for the round-trip tests.
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/queue[redis,test]"
          pip install fakeredis

      - name: Install septum-core (+ transformers + test extras)
        run: pip install -e "packages/core[transformers,test]"

      - name: Install septum-mcp (+ test extra)
        run: pip install -e "packages/mcp[test]"

      - name: Install septum-gateway (+ server + test extras)
        # Server extra pulls fastapi+uvicorn so the /health smoke test
        # can import create_app; respx handles httpx mocking.
        run: pip install -e "packages/gateway[server,test]"

      - name: Install septum-audit (+ queue + server + test extras)
        run: pip install -e "packages/audit[queue,server,test]"

      - name: Install spaCy English model (hash-pinned, same pin as packages/api/requirements.txt)
        run: pip install "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"

      - name: Run septum-queue tests
        run: pytest packages/queue/tests/ -q

      - name: Run septum-core tests
        run: pytest packages/core/tests/ -q

      - name: Run septum-mcp tests
        run: pytest packages/mcp/tests/ -q

      - name: Run septum-gateway tests
        run: pytest packages/gateway/tests/ -q

      - name: Run septum-audit tests
        run: pytest packages/audit/tests/ -q

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff lint
        run: ruff check packages/api/septum_api packages/core/septum_core packages/queue/septum_queue packages/gateway/septum_gateway packages/audit/septum_audit packages/mcp/septum_mcp --select E,W,F,I --ignore E501,E402,E741

      # Skipped checks (everything else, B101/B603/B607 included, stays enforced):
      #   B404 importing subprocess is only a warning; each call is still checked by B603/B607
      #   B105 flags an env-var name, a header name and a token version label, not secrets
      - name: Bandit security scan
        run: bandit -r packages/api/septum_api packages/core/septum_core packages/queue/septum_queue packages/gateway/septum_gateway packages/audit/septum_audit packages/mcp/septum_mcp -s B404,B105 -q

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r packages/api/requirements.txt

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install frontend dependencies
        working-directory: packages/web
        run: npm ci

      - name: Run frontend tests
        working-directory: packages/web
        run: npm test -- --runInBand

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci

      - name: TypeScript type check
        working-directory: packages/web
        run: npx tsc --noEmit

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci

      # Dev/build tooling is excluded: the only remaining high advisory
      # (braces GHSA-vfj7-8cjw-p6xm, no patched release) is build/test-only
      # and only sees globs from config files. Dependabot still tracks dev
      # deps. Switch back to the full audit once braces is patched.
      - name: npm audit
        working-directory: packages/web
        run: npm audit --omit=dev --audit-level=high

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci

      - name: ESLint
        working-directory: packages/web
        run: npm run lint

  repo-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Policy check unit tests
        run: |
          python -m pip install pytest
          python -m pytest .github/scripts -q

      - name: Repository policy checks
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python .github/scripts/policy_check.py

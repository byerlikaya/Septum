# zone-edge: the only way in or out of the air-gapped `zone` network
# (docker-compose.airgap.yml). It sits on `zone` (internal, no egress) and
# `edge` (normal bridge) and relays exactly these paths:
#   :3000  host -> web               (published, HTTP, adds X-Forwarded-For)
#   :8765  host -> mcp               (published, TCP, mcp profile)
#   :6379  api  -> gateway-zone Redis at SEPTUM_GATEWAY_QUEUE_ADDR (TCP;
#                  bound to the zone address, accepted only from the api)
# Anything else from inside the zone has no route out. Ollama runs inside
# the zone (docker-compose.airgap.yml) and is not relayed.
#
# No traffic logging: neither client addresses nor requests are logged.
# HAProxy only prints startup and configuration alerts to stderr.

# Names resolve at runtime via Docker's embedded DNS; a backend that is not
# running (mcp profile off) or not resolvable yet starts unresolved instead
# of keeping the relay from starting. IPv4 is preferred: the zone networks
# have no IPv6.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    timeout connect 5s
    timeout client 10m
    timeout server 10m
    timeout http-request 10s
    timeout tunnel 1h
    default-server init-addr last,libc,none resolve-prefer ipv4

frontend health
    bind 127.0.0.1:8404
    mode http
    monitor-uri /healthz

# web and mcp take connections from the published ports (the edge side);
# zone containers reach those services directly and are refused here.
frontend web
    bind :3000
    mode http
    tcp-request connection reject if { src "${SEPTUM_SUBNET}" }
    # The client's own forwarding headers are dropped; the TCP peer is
    # appended as X-Forwarded-For. web trusts it only from this relay's
    # fixed address (SEPTUM_TRUSTED_PROXIES).
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    option forwardfor
    default_backend to_web

backend to_web
    mode http
    server web web:3000 resolvers docker

frontend mcp
    bind :8765
    mode tcp
    tcp-request connection reject if { src "${SEPTUM_SUBNET}" }
    default_backend to_mcp

backend to_mcp
    mode tcp
    server mcp mcp:8765 resolvers docker

# Zone interface only, and only the api's fixed address: the edge side and
# every other zone container are refused.
frontend queue
    bind "${SEPTUM_ZONE_EDGE_IP}:6379"
    mode tcp
    tcp-request connection reject unless { src "${SEPTUM_API_IP}" }
    timeout client 1h
    option clitcpka
    default_backend to_queue

backend to_queue
    mode tcp
    timeout server 1h
    option srvtcpka
    server queue "${SEPTUM_GATEWAY_QUEUE_ADDR}" resolvers docker

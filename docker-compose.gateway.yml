# -----------------------------------------------------------------------------
# Septum — internet-facing deployment (gateway + audit)
#
# Runs ONLY the internet-facing zone modules: gateway + audit + redis.
# No api, no web, no septum-core. Consumes already-masked requests off
# Redis Streams, forwards them to Anthropic / OpenAI / OpenRouter, and
# publishes the masked answers back on the response stream.
#
# Start:
#   docker compose -f docker-compose.gateway.yml up -d
#
# This Redis IS the queue. The air-gapped api connects to it (its
# SEPTUM_QUEUE_URL, see docker-compose.airgap.yml); the air-gapped side
# never gets a credential for the local Redis, and this host never gets one for it.
# Binds (host interface for published ports):
#   SEPTUM_GATEWAY_REDIS_BIND   REQUIRED. Gateway host's private/VPN IP, never 0.0.0.0.
#                               Compose refuses to start without it.
#   SEPTUM_GATEWAY_HEALTH_BIND  gateway health port (8001), default 127.0.0.1
#   SEPTUM_AUDIT_BIND           audit API port (8002), default 127.0.0.1
#
# Docker-published ports bypass host INPUT rules (ufw / firewalld). The bind
# variable is the restriction that works; additionally, or instead, restrict
# with rules in the DOCKER-USER chain so only the air-gapped host / VPN subnet
# can reach 6379.
# Traffic is plaintext (AUTH and masked payloads): run it over a VPN or private
# link. rediss:// needs TLS on this Redis listener, which this file does not configure.
# -----------------------------------------------------------------------------

x-gateway-base: &gateway-base
  build:
    context: .
    dockerfile: docker/gateway.Dockerfile
  image: septum-gateway:local
  pull_policy: never
  environment: &gateway-env
    SEPTUM_QUEUE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379/0
    SEPTUM_GATEWAY_REQUEST_TOPIC: septum.llm.requests
    SEPTUM_GATEWAY_RESPONSE_TOPIC: septum.llm.responses
    SEPTUM_GATEWAY_AUDIT_TOPIC: septum.audit.events
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

x-audit-base: &audit-base
  build:
    context: .
    dockerfile: docker/audit.Dockerfile
  image: septum-audit:local
  pull_policy: never
  environment: &audit-env
    SEPTUM_QUEUE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379/0
    SEPTUM_AUDIT_TOPIC: septum.audit.events
    SEPTUM_AUDIT_SINK_PATH: /var/log/septum/audit.jsonl
  volumes:
    - septum-audit-log:/var/log/septum
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    container_name: septum-gateway-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}"]
    ports:
      - "${SEPTUM_GATEWAY_REDIS_BIND:?set SEPTUM_GATEWAY_REDIS_BIND to the gateway host's private/VPN IP (see docker-compose.gateway.yml header)}:6379:6379"
    volumes:
      - septum-gateway-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)} redis-cli ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  gateway-worker:
    <<: *gateway-base
    container_name: septum-gateway-worker
    environment:
      <<: *gateway-env
      # Provider keys live on the internet-facing zone. The air-gapped
      # side may also thread a key through RequestEnvelope.api_key —
      # envelope key always wins.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["python", "-m", "septum_gateway"]

  gateway-health:
    <<: *gateway-base
    container_name: septum-gateway-health
    command:
      ["python", "-m", "uvicorn", "septum_gateway.main:create_app",
       "--factory", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${SEPTUM_GATEWAY_HEALTH_BIND:-127.0.0.1}:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  audit-worker:
    <<: *audit-base
    container_name: septum-audit-worker
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "septum_audit"]

  audit-api:
    <<: *audit-base
    container_name: septum-audit-api
    command:
      ["python", "-m", "uvicorn", "septum_audit.main:create_app",
       "--factory", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "${SEPTUM_AUDIT_BIND:-127.0.0.1}:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  septum-gateway-redis-data:
  septum-audit-log:

# -----------------------------------------------------------------------------
# Septum — internet-facing deployment (gateway + audit)
#
# Runs ONLY the internet-facing zone modules: gateway + audit + redis.
# No api, no web, no septum-core. Consumes already-masked requests off
# Redis Streams, forwards them to Anthropic / OpenAI / OpenRouter, and
# publishes the masked answers back on the response stream.
#
# Start:
#   docker compose -f docker-compose.gateway.yml up -d
#
# This Redis IS the queue. The default user is off; each client has its own
# ACL user that can reach only its streams and only the stream commands:
#   septum-api      request + response streams (the air-gapped api, through
#                   its zone-edge relay, see docker-compose.airgap.yml)
#   septum-gateway  request + response + audit streams (gateway-worker)
#   septum-audit    audit stream (audit-worker, audit-api)
#   health          PING only (this file's healthcheck)
# Passwords are required: SEPTUM_QUEUE_API_PASSWORD, SEPTUM_QUEUE_GATEWAY_PASSWORD,
# SEPTUM_QUEUE_AUDIT_PASSWORD, SEPTUM_QUEUE_HEALTH_PASSWORD (hex, no spaces;
# see .env.example). The air-gapped host gets only the septum-api password.
# Binds (host interface for published ports):
#   SEPTUM_GATEWAY_REDIS_BIND   REQUIRED. Gateway host's private/VPN IP, never 0.0.0.0.
#                               Compose refuses to start without it.
#   SEPTUM_GATEWAY_HEALTH_BIND  gateway health port (8001), default 127.0.0.1
#   SEPTUM_AUDIT_BIND           audit API port (8002), default 127.0.0.1
#
# Docker-published ports bypass host INPUT rules (ufw / firewalld). The bind
# variable is the restriction that works; additionally, or instead, restrict
# with rules in the DOCKER-USER chain so only the air-gapped host / VPN subnet
# can reach 6379.
# Traffic is plaintext (AUTH and masked payloads): run it over a VPN or private
# link. rediss:// needs TLS on this Redis listener, which this file does not configure.
# -----------------------------------------------------------------------------

x-gateway-base: &gateway-base
  build:
    context: .
    dockerfile: docker/gateway.Dockerfile
  image: septum-gateway:local
  pull_policy: never
  environment: &gateway-env
    SEPTUM_QUEUE_URL: redis://septum-gateway:${SEPTUM_QUEUE_GATEWAY_PASSWORD:?SEPTUM_QUEUE_GATEWAY_PASSWORD must be set (see .env.example)}@redis:6379/0
    SEPTUM_GATEWAY_REQUEST_TOPIC: septum.llm.requests
    SEPTUM_GATEWAY_RESPONSE_TOPIC: septum.llm.responses
    SEPTUM_GATEWAY_AUDIT_TOPIC: septum.audit.events
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

x-audit-base: &audit-base
  build:
    context: .
    dockerfile: docker/audit.Dockerfile
  image: septum-audit:local
  pull_policy: never
  environment: &audit-env
    SEPTUM_QUEUE_URL: redis://septum-audit:${SEPTUM_QUEUE_AUDIT_PASSWORD:?SEPTUM_QUEUE_AUDIT_PASSWORD must be set (see .env.example)}@redis:6379/0
    SEPTUM_AUDIT_TOPIC: septum.audit.events
    SEPTUM_AUDIT_SINK_PATH: /var/log/septum/audit.jsonl
  volumes:
    - septum-audit-log:/var/log/septum
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    container_name: septum-gateway-redis
    # One ACL rule per argv entry (a rule string with spaces fails startup).
    # +ping is required: redis-py pings idle connections. The /0 queue URLs
    # send no SELECT, so it is not granted.
    command:
      - redis-server
      # Memory backstop for the queue streams: when full, writes (XADD) fail
      # with OOM instead of evicting queued messages.
      - --maxmemory
      - "${SEPTUM_QUEUE_REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - noeviction
      # Queue messages are transient: no RDB snapshot, no AOF.
      - --save
      - ""
      - --appendonly
      - "no"
      - --user
      - default
      - "off"
      - resetpass
      - resetkeys
      - resetchannels
      - -@all
      - --user
      - septum-api
      - "on"
      - ">${SEPTUM_QUEUE_API_PASSWORD:?SEPTUM_QUEUE_API_PASSWORD must be set (see .env.example)}"
      - resetkeys
      - "~septum:septum.llm.requests"
      - "~septum:septum.llm.responses"
      - resetchannels
      - -@all
      - +ping
      - +xgroup|create
      - +xadd
      - +xreadgroup
      - +xautoclaim
      - +xack
      - +xdel
      - +xrange
      - --user
      - septum-gateway
      - "on"
      - ">${SEPTUM_QUEUE_GATEWAY_PASSWORD:?SEPTUM_QUEUE_GATEWAY_PASSWORD must be set (see .env.example)}"
      - resetkeys
      - "~septum:septum.llm.requests"
      - "~septum:septum.llm.responses"
      - "~septum:septum.audit.events"
      - resetchannels
      - -@all
      - +ping
      - +xgroup|create
      - +xadd
      - +xreadgroup
      - +xautoclaim
      - +xack
      - +xdel
      - +xrange
      - --user
      - septum-audit
      - "on"
      - ">${SEPTUM_QUEUE_AUDIT_PASSWORD:?SEPTUM_QUEUE_AUDIT_PASSWORD must be set (see .env.example)}"
      - resetkeys
      - "~septum:septum.audit.events"
      - resetchannels
      - -@all
      - +ping
      - +xgroup|create
      - +xadd
      - +xreadgroup
      - +xautoclaim
      - +xack
      - +xdel
      - +xrange
      - --user
      - health
      - "on"
      - ">${SEPTUM_QUEUE_HEALTH_PASSWORD:?SEPTUM_QUEUE_HEALTH_PASSWORD must be set (see .env.example)}"
      - resetkeys
      - resetchannels
      - -@all
      - +ping
    environment:
      SEPTUM_QUEUE_HEALTH_PASSWORD: ${SEPTUM_QUEUE_HEALTH_PASSWORD:?SEPTUM_QUEUE_HEALTH_PASSWORD must be set (see .env.example)}
    ports:
      - "${SEPTUM_GATEWAY_REDIS_BIND:?set SEPTUM_GATEWAY_REDIS_BIND to the gateway host's private/VPN IP (see docker-compose.gateway.yml header)}:6379:6379"
    restart: unless-stopped
    healthcheck:
      # redis-cli exits 0 even on WRONGPASS, so the reply itself is checked.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$SEPTUM_QUEUE_HEALTH_PASSWORD\" redis-cli --user health --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  gateway-worker:
    <<: *gateway-base
    container_name: septum-gateway-worker
    environment:
      <<: *gateway-env
      # Provider keys live on the internet-facing zone. The air-gapped
      # side may also thread a key through RequestEnvelope.api_key —
      # envelope key always wins.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["python", "-m", "septum_gateway"]
    # The image HEALTHCHECK polls an HTTP port this worker never serves.
    healthcheck:
      disable: true

  gateway-health:
    <<: *gateway-base
    container_name: septum-gateway-health
    command:
      ["python", "-m", "uvicorn", "septum_gateway.main:create_app",
       "--factory", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${SEPTUM_GATEWAY_HEALTH_BIND:-127.0.0.1}:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  audit-worker:
    <<: *audit-base
    container_name: septum-audit-worker
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "septum_audit"]
    # The image HEALTHCHECK polls an HTTP port this worker never serves.
    healthcheck:
      disable: true

  audit-api:
    <<: *audit-base
    container_name: septum-audit-api
    command:
      ["python", "-m", "uvicorn", "septum_audit.main:create_app",
       "--factory", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "${SEPTUM_AUDIT_BIND:-127.0.0.1}:8002:8002"
    # The API only reads the ledger and its sidecars; read-only mount enforces that.
    volumes:
      - septum-audit-log:/var/log/septum:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  septum-audit-log:

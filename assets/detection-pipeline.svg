<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" role="img" aria-labelledby="dp-t dp-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="dp-t">Septum three-layer detection pipeline</title>
  <desc id="dp-d">Document or chat text passes through the Presidio, NER and optional Ollama layers, is merged with coreference resolution, and produces masked text with an anonymisation map.</desc>
  <defs>
    <marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5A6D"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1F2D3D" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="239" rx="16" fill="#F5F8FB" stroke="#D9E1E6"/>
<path d="M200 120 H238" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M420 120 H458" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M640 120 H678" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M860 120 H898" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M1080 120 H1118" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="20" y="80" width="180" height="80" rx="40" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(71.3 104.0) scale(0.938)" fill="none" stroke="#1F2D3D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5l1.6-5.5h7.8l1.6 5.5v3.6h-11z"/><path d="M2.5 9.5h3l.8 1.5h3.4l.8-1.5h3"/></g><text x="92.3" y="116.1" font-size="13" font-weight="600" fill="#1F2D3D" text-anchor="start">Document</text><text x="110.0" y="133.0" font-size="13" font-weight="600" fill="#1F2D3D" text-anchor="middle">or chat message</text>
<rect x="240" y="80" width="180" height="80" rx="10" fill="#EAF2FA" stroke="#7dafda" stroke-width="1.25" filter="url(#sh)"/><text x="330.0" y="110.2" font-size="13" font-weight="700" fill="#1F4E7E" text-anchor="middle">Layer 1 · Presidio</text><text x="330.0" y="125.2" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">Regex +</text><text x="330.0" y="139.5" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">algorithmic validators</text>
<rect x="460" y="80" width="180" height="80" rx="10" fill="#EAF2FA" stroke="#7dafda" stroke-width="1.25" filter="url(#sh)"/><text x="550.0" y="110.2" font-size="13" font-weight="700" fill="#1F4E7E" text-anchor="middle">Layer 2 · NER</text><text x="550.0" y="125.2" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">XLM-RoBERTa,</text><text x="550.0" y="139.5" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">per-language model</text>
<rect x="680" y="80" width="180" height="80" rx="10" fill="#EAF2FA" stroke="#7dafda" stroke-width="1.25" stroke-dasharray="5 4" filter="url(#sh)"/><text x="770.0" y="110.2" font-size="13" font-weight="700" fill="#1F4E7E" text-anchor="middle">Layer 3 · Ollama</text><text x="770.0" y="125.2" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">Semantic detection</text><text x="770.0" y="139.5" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">(optional)</text>
<rect x="900" y="80" width="180" height="80" rx="10" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" filter="url(#sh)"/><text x="990.0" y="109.6" font-size="13" font-weight="700" fill="#24583A" text-anchor="middle">Merge +</text><text x="990.0" y="126.5" font-size="13" font-weight="700" fill="#24583A" text-anchor="middle">coreference</text><text x="990.0" y="140.4" font-size="10" font-weight="400" fill="#24583A" text-anchor="middle">dedup · alias resolve</text>
<rect x="1120" y="80" width="140" height="80" rx="40" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(1144.3 98.7) scale(0.875)" fill="none" stroke="#24583A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5v4h11v-4"/><path d="M8 10V2.3M5.2 5l2.8-2.8L10.8 5"/></g><text x="1164.3" y="109.9" font-size="12" font-weight="700" fill="#24583A" text-anchor="start">Masked text</text><text x="1190.0" y="124.5" font-size="11" font-weight="400" fill="#24583A" text-anchor="middle">+ anonymisation</text><text x="1190.0" y="138.8" font-size="11" font-weight="400" fill="#24583A" text-anchor="middle">map</text>
<text x="640" y="214" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle" font-style="italic" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">All layers run locally — raw PII never leaves the machine.</text>
</svg>

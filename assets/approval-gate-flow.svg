<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="ag-t ag-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="ag-t">Approval gate: three panels, one decision</title>
  <desc id="ag-d">Three panels show the masked prompt, the retrieved chunks and the assembled cloud prompt. The user approves the send, which goes to the cloud LLM, or rejects it, and nothing leaves.</desc>
  <defs>
    <marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F7D4F"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B5484A"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1F2D3D" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="1099" height="479" rx="16" fill="#F5F8FB" stroke="#D9E1E6"/>
<text x="550" y="36" font-size="18" font-weight="700" fill="#1F2D3D" text-anchor="middle">Approval Gate — three panels, one decision</text>
<rect x="40" y="80" width="320" height="220" rx="14" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/>
<text x="200" y="112" font-size="14" font-weight="700" fill="#1F2D3D" text-anchor="middle">1 · Masked prompt</text>
<text x="200" y="132" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">what your message looks like</text>
<text x="200" y="148" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">after PII is replaced</text>
<rect x="56" y="162" width="288" height="74" rx="8" fill="#F3F6FA" stroke="#E0E7EE" stroke-width="1.25"/>
<text x="72" y="185" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"Summarise the discharge plan</text>
<text x="72" y="205" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for [PERSON_NAME_1] and list</text>
<text x="72" y="225" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">her follow-up medications"</text>
<text x="200" y="263" font-size="10" font-weight="600" fill="#1F4E7E" text-anchor="middle">read-only</text>
<text x="200" y="281" font-size="10" font-weight="400" fill="#5B6B7D" text-anchor="middle">edit your message instead</text>
<rect x="390" y="80" width="320" height="220" rx="14" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/>
<text x="550" y="112" font-size="14" font-weight="700" fill="#1F2D3D" text-anchor="middle">2 · Retrieved chunks</text>
<text x="550" y="132" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">document parts the LLM</text>
<text x="550" y="148" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">will see — also masked</text>
<rect x="406" y="162" width="288" height="74" rx="8" fill="#F3F6FA" stroke="#E0E7EE" stroke-width="1.25"/>
<text x="422" y="185" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"… [PERSON_NAME_1] was discharged</text>
<text x="422" y="205" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">on 6 March 2026 in [LOCATION_1]</text>
<text x="422" y="225" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">after a cardiology stay …"</text>
<text x="550" y="263" font-size="10" font-weight="600" fill="#1F4E7E" text-anchor="middle">editable</text>
<text x="550" y="281" font-size="10" font-weight="400" fill="#5B6B7D" text-anchor="middle">drop chunks you don't want sent</text>
<rect x="740" y="80" width="320" height="220" rx="14" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/>
<text x="900" y="112" font-size="14" font-weight="700" fill="#1F2D3D" text-anchor="middle">3 · Assembled cloud prompt</text>
<text x="900" y="132" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">the exact bytes that will</text>
<text x="900" y="148" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">leave the air-gapped zone</text>
<rect x="756" y="162" width="288" height="74" rx="8" fill="#F3F6FA" stroke="#E0E7EE" stroke-width="1.25"/>
<text x="772" y="185" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SYSTEM: …</text>
<text x="772" y="205" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CONTEXT: [chunks]</text>
<text x="772" y="225" font-size="11" font-weight="400" fill="#2F3E50" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USER: [masked question]</text>
<text x="900" y="263" font-size="10" font-weight="600" fill="#1F4E7E" text-anchor="middle">read-only</text>
<text x="900" y="281" font-size="10" font-weight="400" fill="#5B6B7D" text-anchor="middle">final pre-flight check</text>
<path d="M200 300 V320 H900 V300" fill="none" stroke="#8E9CAD" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M550 300 V340" fill="none" stroke="#8E9CAD" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="550,340 700,400 550,460 400,400" fill="#2a6aa8" stroke="#1F4E7E" stroke-width="1.25" stroke-linejoin="round" filter="url(#sh)"/><text x="550" y="397.8" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send?</text><text x="550" y="412.9" font-size="11" font-weight="400" fill="#D6E6F7" text-anchor="middle">your call</text>
<path d="M695 400 H850" fill="none" stroke="#2F7D4F" stroke-width="2" stroke-linejoin="round" marker-end="url(#m0)"/>
<text x="900" y="395" font-size="13" font-weight="700" fill="#2F7D4F" text-anchor="middle">Approve</text>
<text x="900" y="413" font-size="11" font-weight="400" fill="#2F7D4F" text-anchor="middle">→ Cloud LLM</text>
<path d="M405 400 H250" fill="none" stroke="#B5484A" stroke-width="2" stroke-linejoin="round" marker-end="url(#m1)"/>
<text x="200" y="395" font-size="13" font-weight="700" fill="#B5484A" text-anchor="end">Reject</text>
<text x="200" y="413" font-size="11" font-weight="400" fill="#B5484A" text-anchor="end">nothing leaves</text>
</svg>

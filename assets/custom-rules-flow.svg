<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="cr-t cr-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="cr-t">Custom rule pipeline</title>
  <desc id="cr-d">A custom rule detects with a regex, a keyword list or an LLM prompt. The policy composer merges its matches with the built-in packs, and the matched text is masked.</desc>
  <defs>
    <marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5A6D"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1F2D3D" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="459" rx="16" fill="#F5F8FB" stroke="#D9E1E6"/>
<text x="440" y="36" font-size="18" font-weight="700" fill="#1F2D3D" text-anchor="middle">Custom Rule Pipeline</text>
<polygon points="440,68 540,118 440,168 340,118" fill="#2a6aa8" stroke="#1F4E7E" stroke-width="1.25" stroke-linejoin="round" filter="url(#sh)"/><text x="440" y="115.8" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Custom Rule</text><text x="440" y="130.9" font-size="11" font-weight="400" fill="#D6E6F7" text-anchor="middle">choose detection type</text>
<rect x="60" y="200" width="220" height="78" rx="10" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><text x="170.0" y="229.9" font-size="13" font-weight="700" fill="#1F2D3D" text-anchor="middle">Regex</text><text x="170.0" y="244.8" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">Pattern matching</text><text x="170.0" y="258.1" font-size="10" font-weight="400" fill="#1F4E7E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">\bSTUDY-\d{4}-\d{5}\b</text><rect x="60" y="212" width="4" height="54" rx="2" fill="#2a6aa8"/>
<rect x="330" y="200" width="220" height="78" rx="10" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><text x="440.0" y="229.9" font-size="13" font-weight="700" fill="#1F2D3D" text-anchor="middle">Keyword</text><text x="440.0" y="244.8" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">Word list</text><text x="440.0" y="258.1" font-size="10" font-weight="400" fill="#1F4E7E" text-anchor="middle">"Project Bluebird", "Halcyon"</text><rect x="330" y="212" width="4" height="54" rx="2" fill="#579cd4"/>
<rect x="600" y="200" width="220" height="78" rx="10" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><text x="710.0" y="229.9" font-size="13" font-weight="700" fill="#1F2D3D" text-anchor="middle">LLM Prompt</text><text x="710.0" y="244.8" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">Semantic check</text><text x="710.0" y="258.1" font-size="10" font-weight="400" fill="#1F4E7E" text-anchor="middle">"Does this contain a diagnosis?"</text><rect x="600" y="212" width="4" height="54" rx="2" fill="#4B6F96"/>
<path d="M410 160 L220 200" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M440 168 V200" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M470 160 L660 200" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M170 278 L380 320" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M440 278 V320" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M710 278 L500 320" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="290" y="320" width="300" height="60" rx="10" fill="#2a6aa8" stroke="#1F4E7E" stroke-width="1.25" filter="url(#sh)"/><text x="440.0" y="347.8" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Match found in text</text><text x="440.0" y="362.9" font-size="11" font-weight="400" fill="#D6E6F7" text-anchor="middle">policy composer merges with built-in packs</text>
<path d="M440 380 V410" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="350" y="410" width="180" height="40" rx="8" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" filter="url(#sh)"/><text x="440.0" y="434.6" font-size="13" font-weight="700" fill="#24583A" text-anchor="middle">→ Masked</text>
</svg>

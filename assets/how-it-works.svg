<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="how-t how-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="how-t">Septum chat flow</title>
  <desc id="how-d">The user question is masked locally by Septum, sent to the cloud LLM as placeholders, and the answer is restored locally before it reaches the user.</desc>
  <defs>
    <marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5A6D"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8E9CAD"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1F2D3D" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="599" rx="16" fill="#F5F8FB" stroke="#D9E1E6"/>
<line x1="130" y1="85" x2="130" y2="460" stroke="#B4C1CD" stroke-width="1.25" stroke-dasharray="4 5"/>
<line x1="480" y1="85" x2="480" y2="460" stroke="#B4C1CD" stroke-width="1.25" stroke-dasharray="4 5"/>
<line x1="830" y1="85" x2="830" y2="460" stroke="#B4C1CD" stroke-width="1.25" stroke-dasharray="4 5"/>
<rect x="55" y="30" width="150" height="50" rx="12" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(103.8 47.0) scale(1.0)" fill="none" stroke="#1F2D3D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.7"/><path d="M3 14.2c0-2.7 2.2-4.6 5-4.6s5 1.9 5 4.6"/></g><text x="125.8" y="59.9" font-size="14" font-weight="600" fill="#1F2D3D" text-anchor="start">User</text>
<rect x="405" y="30" width="150" height="50" rx="12" fill="#2a6aa8" stroke="#1F4E7E" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(446.3 47.0) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l5 1.9v4.1c0 3-2.1 5.3-5 6.4-2.9-1.1-5-3.4-5-6.4V3.7z"/></g><text x="468.3" y="59.9" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Septum</text>
<rect x="755" y="30" width="150" height="50" rx="12" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(784.9 47.0) scale(1.0)" fill="none" stroke="#1F2D3D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13h7.5a2.75 2.75 0 0 0 0-5.5 4 4 0 0 0-7.7-.9A3 3 0 0 0 5 13z"/></g><text x="806.9" y="59.9" font-size="14" font-weight="600" fill="#1F2D3D" text-anchor="start">Cloud LLM</text>
<text x="305" y="115" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Summarise the discharge plan for Elif Demir</text>
<text x="305" y="132" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">and her follow-up visit.</text>
<path d="M130 150 H480" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="370" y="172" width="220" height="46" rx="8" fill="#FDF6E3" stroke="#D9B45A" stroke-width="1.25" filter="url(#sh)"/><text x="480.0" y="192.1" font-size="12" font-weight="600" fill="#7A5A12" text-anchor="middle">Detect &amp; mask PII</text><text x="480.0" y="206.7" font-size="11" font-weight="400" fill="#7A5A12" text-anchor="middle">1 × PERSON_NAME</text>
<text x="655" y="240" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Summarise the discharge plan for [PERSON_NAME_1]</text>
<text x="655" y="257" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">and her follow-up visit.</text>
<path d="M480 275 H830" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<text x="655" y="302" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">[PERSON_NAME_1]: discharged 6 March 2026</text>
<path d="M830 315 H480" fill="none" stroke="#8E9CAD" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m1)"/>
<rect x="370" y="337" width="220" height="46" rx="8" fill="#EAF2FA" stroke="#7dafda" stroke-width="1.25" filter="url(#sh)"/><text x="480.0" y="357.1" font-size="12" font-weight="600" fill="#1F4E7E" text-anchor="middle">Restore placeholders</text><text x="480.0" y="371.7" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">locally — real values back</text>
<text x="305" y="405" font-size="12" font-weight="500" fill="#1F2D3D" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Elif Demir: discharged 6 March 2026</text>
<path d="M480 420 H130" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<rect x="70" y="490" width="820" height="55" rx="12" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" stroke-dasharray="4 3"/><g transform="translate(355.3 509.5) scale(1.0)" fill="none" stroke="#24583A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="7" width="9.6" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></g><text x="377.3" y="522.4" font-size="14" font-weight="600" fill="#24583A" text-anchor="start">Raw PII never left the machine</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ar-t ar-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="ar-t">Auto-RAG routing</title>
  <desc id="ar-d">The user question is classified locally as SEARCH or CHAT. A relevance check routes it either to masked retrieval through the approval gate or to a direct LLM answer.</desc>
  <defs>
    <marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5A6D"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1F2D3D" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="719" rx="16" fill="#F5F8FB" stroke="#D9E1E6"/>
<path d="M480 80 V115" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M420 190 L250 225" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M540 190 L710 225" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M250 300 V335" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M250 445 V480" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M340 395 H650 V585" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M250 555 V605 H278" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0)"/>
<path d="M650 300 V395" fill="none" stroke="#4A5A6D" stroke-width="1.6" stroke-linejoin="round"/>
<text x="320" y="215" font-size="11" font-weight="600" fill="#5E35B1" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SEARCH</text>
<text x="600" y="215" font-size="11" font-weight="600" fill="#5E35B1" text-anchor="middle" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">CHAT</text>
<text x="270" y="470" font-size="11" font-weight="600" fill="#2E7D32" text-anchor="start" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Yes</text>
<text x="355" y="385" font-size="11" font-weight="600" fill="#B5484A" text-anchor="start" stroke="#F5F8FB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">No</text>
<rect x="360" y="30" width="240" height="50" rx="25" fill="#FFFFFF" stroke="#C0CEDB" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(423.7 47.5) scale(0.938)" fill="none" stroke="#1F2D3D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.7"/><path d="M3 14.2c0-2.7 2.2-4.6 5-4.6s5 1.9 5 4.6"/></g><text x="444.7" y="59.5" font-size="13" font-weight="600" fill="#1F2D3D" text-anchor="start">User question</text>
<rect x="300" y="115" width="360" height="75" rx="10" fill="#EAF2FA" stroke="#7dafda" stroke-width="1.25" filter="url(#sh)"/><text x="480.0" y="143.4" font-size="13" font-weight="700" fill="#1F4E7E" text-anchor="middle">Local Ollama intent classifier</text><text x="480.0" y="158.3" font-size="11" font-weight="400" fill="#1F4E7E" text-anchor="middle">decides between SEARCH and CHAT</text><text x="480.0" y="171.6" font-size="10" font-weight="400" fill="#1F4E7E" text-anchor="middle" font-style="italic">only triggered when document_ids is empty</text>
<rect x="120" y="225" width="260" height="75" rx="10" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" filter="url(#sh)"/><text x="250.0" y="253.4" font-size="13" font-weight="700" fill="#24583A" text-anchor="middle">Search all indexed docs</text><text x="250.0" y="268.3" font-size="11" font-weight="400" fill="#24583A" text-anchor="middle">FAISS + BM25 hybrid</text><text x="250.0" y="281.6" font-size="10" font-weight="400" fill="#24583A" text-anchor="middle">user-owned documents only</text>
<rect x="580" y="225" width="260" height="75" rx="10" fill="#E6EBF0" stroke="#9AA6B5" stroke-width="1.25" filter="url(#sh)"/><text x="710.0" y="253.4" font-size="13" font-weight="700" fill="#1F2D3D" text-anchor="middle">Direct LLM answer</text><text x="710.0" y="268.3" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle">no document context</text><text x="710.0" y="281.6" font-size="10" font-weight="400" fill="#5B6B7D" text-anchor="middle">pure chatbot reply</text>
<polygon points="250,335 340,395 250,455 160,395" fill="#FDF6E3" stroke="#D9B45A" stroke-width="1.25" stroke-linejoin="round" filter="url(#sh)"/><text x="250" y="392.1" font-size="12" font-weight="600" fill="#7A5A12" text-anchor="middle">Relevance score</text><text x="250" y="406.7" font-size="11" font-weight="400" fill="#7A5A12" text-anchor="middle">above threshold?</text>
<rect x="120" y="480" width="260" height="75" rx="10" fill="#EAF5EE" stroke="#7FB594" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(211.3 496.3) scale(0.938)" fill="none" stroke="#24583A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3l3.2 3.2"/></g><text x="232.3" y="508.4" font-size="13" font-weight="700" fill="#24583A" text-anchor="start">Auto-RAG</text><text x="250.0" y="523.3" font-size="11" font-weight="400" fill="#24583A" text-anchor="middle">masked chunks + question</text><text x="250.0" y="536.6" font-size="10" font-weight="400" fill="#24583A" text-anchor="middle">goes through approval gate</text>
<rect x="280" y="585" width="400" height="60" rx="10" fill="#2a6aa8" stroke="#1F4E7E" stroke-width="1.25" filter="url(#sh)"/><g transform="translate(371.4 600.5) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l5 1.9v4.1c0 3-2.1 5.3-5 6.4-2.9-1.1-5-3.4-5-6.4V3.7z"/></g><text x="393.4" y="613.4" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">Approval gate → Cloud LLM</text><text x="480.0" y="627.6" font-size="10" font-weight="400" fill="#D6E6F7" text-anchor="middle">user reviews exactly what leaves the machine</text>
<text x="480" y="690" font-size="11" font-weight="400" fill="#5B6B7D" text-anchor="middle" font-style="italic">SSE meta event carries rag_mode: "manual" | "auto" | "none" + matched_document_ids</text>
</svg>

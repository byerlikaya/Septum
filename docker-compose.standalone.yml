# -----------------------------------------------------------------------------
# Septum — standalone single-container deployment
#
# One image, one container. SQLite + direct in-process cloud LLM calls.
# No PostgreSQL, no Redis, no queue, no gateway — the simplest possible
# Septum install. The image is built locally from docker/standalone.Dockerfile.
#
# Start:
#   docker compose -f docker-compose.standalone.yml up -d
#
# For a second tier of parallelism (Postgres + Redis + Ollama profile),
# use docker-compose.yml (the full dev stack) instead.
# -----------------------------------------------------------------------------

services:
  septum:
    build:
      context: .
      dockerfile: docker/standalone.Dockerfile
    image: septum:local
    pull_policy: never
    container_name: septum
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - septum-data:/app/data
      - septum-uploads:/app/uploads
      - septum-anon-maps:/app/anon_maps
      - septum-vector-indexes:/app/vector_indexes
      - septum-bm25-indexes:/app/bm25_indexes
      - septum-models:/app/models
    restart: unless-stopped
    # Plaintext documents live in RAM during ingestion; a core dump would write them to disk.
    ulimits:
      core:
        soft: 0
        hard: 0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

# Fixed names (no compose project prefix) match the volumes the earlier
# `docker run --name septum -v septum-data:/app/data …` install created,
# so switching to this file keeps existing data, keys and models.
volumes:
  septum-data:
    name: septum-data
  septum-uploads:
    name: septum-uploads
  septum-anon-maps:
    name: septum-anon-maps
  septum-vector-indexes:
    name: septum-vector-indexes
  septum-bm25-indexes:
    name: septum-bm25-indexes
  septum-models:
    name: septum-models

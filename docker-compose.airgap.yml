# -----------------------------------------------------------------------------
# Septum — air-gapped deployment
#
# Runs ONLY the air-gapped zone modules: api + web + postgres + redis + ollama
# (+ mcp).
# They sit on the `zone` network, which is internal: no route to the internet
# and no published ports. The single `zone-edge` relay (docker/zone-edge/
# haproxy.cfg) is on `zone` and `edge` and is the only way in or out:
#   :3000  host -> web (the dashboard; the api is reached through it)
#   :8765  host -> mcp (mcp profile, bound to SEPTUM_MCP_BIND)
#   :6379  api  -> the gateway-zone Redis at SEPTUM_GATEWAY_QUEUE_ADDR
#                  (only from the api's fixed address, SEPTUM_API_IP)
# Ollama runs inside the zone (the `ollama` service, http://ollama:11434) and
# has no route out. Load models with the `ollama-pull` one-off (see below).
# Without Ollama: add -f docker-compose.no-ollama.yml.
# The api publishes masked requests onto that Redis; the internet-facing
# gateway (docker-compose.gateway.yml, separate host) consumes them over a
# VPN / private link.
#
# Start:
#   docker compose -f docker-compose.airgap.yml up -d
#
# Required in .env (besides POSTGRES_PASSWORD and REDIS_PASSWORD):
#   SEPTUM_GATEWAY_QUEUE_ADDR    <gateway-private-ip>:6379, the gateway-zone Redis
#   SEPTUM_QUEUE_API_PASSWORD    the septum-api ACL user's password on that Redis
#                                (same value as on the gateway host)
# The api connects as redis://septum-api:<password>@zone-edge:6379/0, which can
# only touch the request and response streams. USE_GATEWAY_DEFAULT is true,
# so the api refuses to start without a queue, and cloud calls never leave
# from this zone. REDIS_URL stays on the local Redis (rate limiter: login
# failures, setup token, error-log buckets); the gateway host never receives
# it. Only masked text crosses the queue.
#
# No host ports for api (8000), postgres or redis: use
#   docker compose -f docker-compose.airgap.yml exec <service> ...
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: septum-postgres
    environment:
      POSTGRES_USER: septum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: septum
    networks: [zone]
    volumes:
      - septum-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septum"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: septum-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}"]
    # Serves REDIS_URL only; never a queue endpoint for other hosts.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}
    networks: [zone]
    volumes:
      - septum-redis-data:/data
    restart: unless-stopped
    healthcheck:
      # Password from the container env, not the healthcheck string; redis-cli
      # exits 0 even on WRONGPASS, so the reply itself is checked.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: septum-api:local
    pull_policy: never
    container_name: septum-api
    environment:
      DATABASE_URL: postgresql+asyncpg://septum:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}@postgres:5432/septum
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379/0
      # Gateway mode: cloud LLM calls flow over Redis Streams to the
      # internet-facing zone instead of happening in-process.
      USE_GATEWAY_DEFAULT: "true"
      SEPTUM_QUEUE_URL: ${SEPTUM_QUEUE_URL:-redis://septum-api:${SEPTUM_QUEUE_API_PASSWORD:?SEPTUM_QUEUE_API_PASSWORD must be set (see .env.example)}@zone-edge:6379/0}
      # The in-zone Ollama service (no egress).
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_ORIGIN: http://localhost:3000
      # Only the web container's proxy may set X-Forwarded-For; anything
      # else (incl. the Docker gateway behind the published port) is
      # taken at face value. Never "*".
      FORWARDED_ALLOW_IPS: ${SEPTUM_WEB_IP:-172.28.70.10}
      # No internet in this zone: a model missing from /app/models fails fast with
      # model_integrity_failed instead of hanging on a Hub download. Pre-populate
      # the volume on a connected host, outside the zone network (compose run
      # would join it and have no egress):
      #   docker run --rm -e HF_HUB_OFFLINE=0 -v <project>_septum-models:/app/models septum-api:local python -m septum_api.cli.models fetch
      HF_HUB_OFFLINE: "1"
    # Fixed address: zone-edge relays the queue only from this one.
    networks:
      zone:
        ipv4_address: ${SEPTUM_API_IP:-172.28.70.12}
    volumes:
      - septum-data:/app/data
      - septum-uploads:/app/uploads
      - septum-anon-maps:/app/anon_maps
      - septum-vector-indexes:/app/vector_indexes
      - septum-bm25-indexes:/app/bm25_indexes
      - septum-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Empty string = same-origin proxy via Next.js rewrites. Override
        # with https://api.example.com for a split deployment.
        NEXT_PUBLIC_API_BASE_URL: ""
        BACKEND_INTERNAL_URL: http://api:8000
    image: septum-web:local
    pull_policy: never
    container_name: septum-web
    environment:
      # zone-edge sets X-Forwarded-For to the real client; only its fixed
      # address is trusted to do so.
      SEPTUM_TRUSTED_PROXIES: ${SEPTUM_ZONE_EDGE_IP:-172.28.70.11}
    networks:
      zone:
        ipv4_address: ${SEPTUM_WEB_IP:-172.28.70.10}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Remote MCP server (opt-in). Air-gapped deployments where a whole
  # team wants to share one masking engine from browser / remote
  # clients benefit most from this — stdio clients running on each
  # laptop don't need it. Gate by setting SEPTUM_MCP_HTTP_TOKEN and
  # enabling the profile:
  #   docker compose -f docker-compose.airgap.yml --profile mcp up
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    image: septum-mcp:local
    pull_policy: never
    container_name: septum-mcp
    environment:
      SEPTUM_MCP_TRANSPORT: streamable-http
      SEPTUM_MCP_HTTP_HOST: 0.0.0.0
      SEPTUM_MCP_HTTP_PORT: "8765"
      SEPTUM_MCP_HTTP_TOKEN: ${SEPTUM_MCP_HTTP_TOKEN:-}
      SEPTUM_MCP_HTTP_ALLOWED_HOSTS: ${SEPTUM_MCP_HTTP_ALLOWED_HOSTS:-}
      SEPTUM_REGULATIONS: ${SEPTUM_REGULATIONS:-}
      SEPTUM_MCP_FILE_ROOT: /data/scan
      HF_HUB_OFFLINE: "1"
    networks: [zone]
    volumes:
      - septum-mcp-scan:/data/scan:ro
      # Read-only: mcp loads snapshots that api or the models fetch CLI already verified.
      - septum-models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    profiles: ["mcp"]

  # Local LLM for the semantic PII layer and the fallback provider. On `zone`
  # only: no egress, no published port, so a pull from the dashboard fails
  # and `*-cloud` model tags cannot reach a cloud. Models come from the
  # ollama-pull one-off below.
  ollama:
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    container_name: septum-ollama
    networks: [zone]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Operator-only model loader; never started by `up`. It runs a throwaway
  # Ollama on `edge` (egress, nothing published, listening on its own
  # loopback), pulls the named models into the shared ollama-data volume and
  # exits. It never joins `zone`, so nothing in the zone gains a route out:
  #   docker compose -f docker-compose.airgap.yml run --rm ollama-pull llama3.2:3b [more:tags]
  # The in-zone ollama lists new models without a restart. A host with no
  # internet at all: copy a connected host's ~/.ollama/models into the
  # <project>_ollama-data volume instead.
  ollama-pull:
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve >/dev/null 2>&1 & until ollama list >/dev/null 2>&1; do sleep 1; done; for m in "$$@"; do ollama pull "$$m" || exit 1; done'
      - ollama-pull
    command: ["llama3.2:3b"]
    networks: [edge]
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["ollama-pull"]

  # The only service with published ports and the only one on `edge`
  # (besides the ollama-pull one-off).
  zone-edge:
    image: haproxy:3.2-alpine@sha256:254e6370f01cd654e0744edf607c67f33777c1b6a9dc0d4b28bcba7171460122
    container_name: septum-zone-edge
    environment:
      SEPTUM_GATEWAY_QUEUE_ADDR: ${SEPTUM_GATEWAY_QUEUE_ADDR:?set SEPTUM_GATEWAY_QUEUE_ADDR to <gateway-private-ip>:6379 (see docker-compose.airgap.yml header)}
      SEPTUM_ZONE_EDGE_IP: ${SEPTUM_ZONE_EDGE_IP:-172.28.70.11}
      SEPTUM_API_IP: ${SEPTUM_API_IP:-172.28.70.12}
      SEPTUM_SUBNET: ${SEPTUM_SUBNET:-172.28.70.0/24}
    volumes:
      - ./docker/zone-edge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      zone:
        ipv4_address: ${SEPTUM_ZONE_EDGE_IP:-172.28.70.11}
      edge: {}
    ports:
      - "3000:3000"
      - "${SEPTUM_MCP_BIND:-127.0.0.1}:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8404/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

# `zone` is internal: no egress, and ports published on it are silently
# dropped, so everything enters and leaves through zone-edge.
# Fixed subnet so web, zone-edge and api get known addresses (the API trusts
# web, web trusts zone-edge, zone-edge relays the queue only for the api). Other containers draw from the upper half
# (ip_range), so the static addresses can never be handed to another one.
# If the subnet collides with a network on the host, override SEPTUM_SUBNET,
# SEPTUM_DYNAMIC_IP_RANGE, SEPTUM_WEB_IP, SEPTUM_ZONE_EDGE_IP and SEPTUM_API_IP
# together.
networks:
  edge: {}
  zone:
    internal: true
    ipam:
      config:
        - subnet: ${SEPTUM_SUBNET:-172.28.70.0/24}
          ip_range: ${SEPTUM_DYNAMIC_IP_RANGE:-172.28.70.128/25}

volumes:
  septum-pgdata:
  septum-redis-data:
  septum-data:
  septum-uploads:
  septum-anon-maps:
  septum-vector-indexes:
  septum-bm25-indexes:
  septum-models:
  septum-mcp-scan:
  ollama-data:

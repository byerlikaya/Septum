# -----------------------------------------------------------------------------
# Septum — air-gapped deployment
#
# Runs ONLY the air-gapped zone modules: api + web + postgres + redis.
# No gateway, no audit, no cloud LLM network egress. The api publishes
# masked requests onto a Redis stream; the internet-facing gateway runs
# on a separate host via docker-compose.gateway.yml and consumes them
# over a VPN / private link.
#
# Start:
#   docker compose -f docker-compose.airgap.yml up -d
#
# Gateway hand-off (one direction: this api connects OUTWARD to the gateway):
#   The queue is the gateway-zone Redis (docker-compose.gateway.yml). Set
#   SEPTUM_QUEUE_URL in .env to it, e.g.
#     SEPTUM_QUEUE_URL=redis://:<gateway REDIS_PASSWORD>@<gateway-private-ip>:6379/0
#   Unset = single-host dev, the queue falls back to the local Redis below.
#   NOT WIRED YET: the api currently ignores SEPTUM_QUEUE_URL (no gateway
#   client factory). Routing through the gateway lands in the next branch.
#   REDIS_URL always stays on the local Redis (rate limiter: login failures,
#   setup token, error-log buckets); the gateway host never receives it.
#   The local Redis is bound to 127.0.0.1 on purpose: it is not reachable
#   from the network. Only masked text crosses the queue.
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: septum-postgres
    environment:
      POSTGRES_USER: septum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: septum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - septum-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septum"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: septum-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}"]
    ports:
      # Loopback on purpose: this Redis serves REDIS_URL only and is never a queue endpoint for other hosts.
      - "127.0.0.1:6379:6379"
    volumes:
      - septum-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)} redis-cli ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: septum-api:local
    pull_policy: never
    container_name: septum-api
    environment:
      DATABASE_URL: postgresql+asyncpg://septum:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}@postgres:5432/septum
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379/0
      # Opt into gateway mode so cloud LLM calls flow over Redis Streams
      # to the internet-facing zone instead of happening in-process.
      # NOT WIRED YET: the api ignores SEPTUM_QUEUE_URL below until the gateway client factory lands.
      USE_GATEWAY_DEFAULT: "true"
      SEPTUM_QUEUE_URL: ${SEPTUM_QUEUE_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}@redis:6379/0}
      FRONTEND_ORIGIN: http://localhost:3000
      # Only the web container's proxy may set X-Forwarded-For; anything
      # else (incl. the Docker gateway behind the published port) is
      # taken at face value. Never "*".
      FORWARDED_ALLOW_IPS: ${SEPTUM_WEB_IP:-172.28.70.10}
      # No internet in this zone: a model missing from /app/models fails fast with
      # model_integrity_failed instead of hanging on a Hub download. Pre-populate
      # the volume with `docker compose run --rm -e HF_HUB_OFFLINE=0 api python -m septum_api.cli.models fetch`
      # on a connected host (compose run inherits this variable, so the override is needed).
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - septum-data:/app/data
      - septum-uploads:/app/uploads
      - septum-anon-maps:/app/anon_maps
      - septum-vector-indexes:/app/vector_indexes
      - septum-bm25-indexes:/app/bm25_indexes
      - septum-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Empty string = same-origin proxy via Next.js rewrites. Override
        # with https://api.example.com for a split deployment.
        NEXT_PUBLIC_API_BASE_URL: ""
        BACKEND_INTERNAL_URL: http://api:8000
    image: septum-web:local
    pull_policy: never
    container_name: septum-web
    networks:
      default:
        ipv4_address: ${SEPTUM_WEB_IP:-172.28.70.10}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Remote MCP server (opt-in). Air-gapped deployments where a whole
  # team wants to share one masking engine from browser / remote
  # clients benefit most from this — stdio clients running on each
  # laptop don't need it. Gate by setting SEPTUM_MCP_HTTP_TOKEN and
  # enabling the profile:
  #   docker compose -f docker-compose.airgap.yml --profile mcp up
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    image: septum-mcp:local
    pull_policy: never
    container_name: septum-mcp
    environment:
      SEPTUM_MCP_TRANSPORT: streamable-http
      SEPTUM_MCP_HTTP_HOST: 0.0.0.0
      SEPTUM_MCP_HTTP_PORT: "8765"
      SEPTUM_MCP_HTTP_TOKEN: ${SEPTUM_MCP_HTTP_TOKEN:-}
      SEPTUM_MCP_HTTP_ALLOWED_HOSTS: ${SEPTUM_MCP_HTTP_ALLOWED_HOSTS:-}
      SEPTUM_REGULATIONS: ${SEPTUM_REGULATIONS:-}
      SEPTUM_MCP_FILE_ROOT: /data/scan
      HF_HUB_OFFLINE: "1"
    ports:
      - "${SEPTUM_MCP_BIND:-127.0.0.1}:8765:8765"
    volumes:
      - septum-mcp-scan:/data/scan:ro
      # Read-only: mcp loads snapshots that api or the models fetch CLI already verified.
      - septum-models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    profiles: ["mcp"]

# Fixed subnet so web gets a known address the API trusts as its proxy.
# Other containers draw from the upper half (ip_range), so the static
# web address can never be handed to another one. If the subnet collides
# with a network on the host, override SEPTUM_SUBNET,
# SEPTUM_DYNAMIC_IP_RANGE and SEPTUM_WEB_IP together.
networks:
  default:
    ipam:
      config:
        - subnet: ${SEPTUM_SUBNET:-172.28.70.0/24}
          ip_range: ${SEPTUM_DYNAMIC_IP_RANGE:-172.28.70.128/25}

volumes:
  septum-pgdata:
  septum-redis-data:
  septum-data:
  septum-uploads:
  septum-anon-maps:
  septum-vector-indexes:
  septum-bm25-indexes:
  septum-models:
  septum-mcp-scan:

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "septum-core"
version = "0.1.0"
description = "Privacy-first PII detection, masking, and unmasking engine. Zero network dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Septum contributors" },
]
keywords = ["pii", "privacy", "anonymization", "gdpr", "kvkk", "hipaa", "presidio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# CRITICAL: septum-core MUST NOT declare or transitively require any network
# library. No httpx, requests, aiohttp, urllib3, grpc, or similar. Any feature
# that needs network access is injected through a Protocol defined inside this
# package so the core stays air-gap safe.
dependencies = [
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    # Security floor: presidio-anonymizer 2.2.363/2.2.364 cap cryptography
    # below the patched releases, so this floor forces the resolver onto a
    # presidio-anonymizer that accepts a patched cryptography.
    "cryptography>=50.0.0",
    "spacy>=3.8.16",
    # preshed 3.0.14 breaks spacy.load of the shipped models (OverflowError in
    # Tokenizer.rules); exclude it so the resolver keeps 3.0.13 or a later fix.
    "preshed!=3.0.14",
    "pydantic>=2.10",
    "regex>=2024.11.6",
    # CLDR month names for the shared date grammar; bundled data, no network.
    "babel>=2.18,<3",
    # Exception to the rule above: tldextract is required to force the bundled
    # public-suffix snapshot (no fetch, no disk cache; see septum_core.suffix_list).
    # It pulls in `requests` transitively, which presidio-analyzer already did.
    "tldextract>=5.4,<6",
]

[project.optional-dependencies]
transformers = [
    "transformers>=5.10.0",
    "torch>=2.13.0",
    # Pinned, verified model fetches (septum_core.model_integrity). Both
    # already arrive through transformers; declared because core calls them.
    "huggingface-hub>=1.31.0,<3.0",
    "filelock>=3.10.0",
]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

[project.urls]
Homepage = "https://github.com/byerlikaya/Septum"
Repository = "https://github.com/byerlikaya/Septum"
Issues = "https://github.com/byerlikaya/Septum/issues"

[tool.hatch.build.targets.wheel]
packages = ["septum_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
